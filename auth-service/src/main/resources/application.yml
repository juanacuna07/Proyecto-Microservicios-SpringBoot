server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:postgres_auth_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway crea el esquema; JPA solo lo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    issuer: ${JWT_ISSUER:taller-02-auth-service}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:../keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../keys/public.pem}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
