name: CI/CD - Microservicios

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1) Compilacion y pruebas con Maven
  build-and-test:
    name: Compilar y probar (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B -ntp verify

  # 2) Construccion de imagenes Docker (y publicacion en Docker Hub si hay secretos)
  docker-images:
    name: Imagen ${{ matrix.service }}
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ api-gateway, auth-service, user-service ]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir (y publicar en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && env.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/p03-${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/p03-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
