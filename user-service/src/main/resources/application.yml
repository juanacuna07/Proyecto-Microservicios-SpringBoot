server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: ${USERS_DB_URL:jdbc:postgresql://localhost:5434/users_db}
    username: ${USERS_DB_USER:postgres}
    password: ${USERS_DB_PASSWORD:postgres_users_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway crea el esquema; JPA solo lo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    issuer: ${JWT_ISSUER:taller-02-auth-service}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
